<!-- ========================= signup.html ========================= -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | Code Quest</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

body{
  margin:0;
  font-family:'Fredoka',sans-serif;
  background:linear-gradient(to bottom right,#77a1d3,#79cbca,#e684ae);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:420px;
  background:white;
  padding:40px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,0.15);
}

h1{
  color:#79cbca;
  margin-bottom:5px;
}

p{
  color:#666;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:12px;
  background:#f3f3f3;
  font-size:16px;
}

input:focus{
  outline:none;
  border:2px solid #79cbca;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(to right,#77a1d3,#79cbca);
  color:white;
  font-size:17px;
  cursor:pointer;
  margin-top:20px;
  transition:0.3s;
}

button:hover{
  background:linear-gradient(to right,#79cbca,#e684ae);
}

.redirect{
  margin-top:20px;
  font-size:15px;
}

.redirect a{
  color:#e684ae;
  text-decoration:none;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Code Quest</h1>

<p>Create your account</p>

<form id="signup-form">

<input type="text"
placeholder="Username"
required>

<input type="email"
placeholder="Email Address"
required>

<input type="password"
placeholder="Password"
required>

<button type="submit">
Sign Up
</button>

</form>

<div class="redirect">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script>

document
.getElementById('signup-form')
.addEventListener('submit',function(e){

e.preventDefault();

const username = e.target[0].value;
const email = e.target[1].value;
const password = e.target[2].value;

const user = {

username:username,
email:email,
password:password

};

localStorage.setItem(
'user',
JSON.stringify(user)
);

alert("Signup Successful!");

window.location.href = "login.html";

});

</script>

</body>
</html>
